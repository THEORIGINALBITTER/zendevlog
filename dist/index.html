  <!-- About template -->
  <template id="tpl-about">
    <article class="post-page">
      <div class="post-header">
        <div class="post-meta-top">
          <span class="post-tag">About</span>
        </div>
        <h1 class="post-title">ZenDev Log</h1>
        <p class="post-subtitle">Mein öffentliches Entwicklertagebuch über ZenPost Studio, ZenOrbit und neue Softwareprodukte.</p>
        <div class="post-byline">
          <div class="author-avatar">
            <img src="/assets/deni_round-384.webp" alt="Denis Bitter" class="author-avatar-img" />
          </div>
          <div class="byline-info">
            <span class="byline-author">Denis Bitter</span>
            <span class="byline-date">Indie FullStack Developer · Hamburg</span>
          </div>
          <a href="https://denisbitter.de" target="_blank" rel="noopener" class="byline-cta">Website ↗</a>
        </div>
      </div>
      <div class="post-body">
        <p>ZenDev Log ist die öffentliche Schicht über meiner Produktentwicklung. Hier dokumentiere ich <strong>ZenPost Studio, ZenOrbit und neue interne Experimente</strong> als echtes Entwicklertagebuch statt als glattgebügeltes Marketing.</p>

        <h2>Was hier dokumentiert wird</h2>
        <ul>
          <li><strong>Daily Logs</strong> — was ich an einem Tag gebaut habe, was blockiert und was als Nächstes kommt</li>
          <li><strong>Architektur-Notizen</strong> — warum ich bestimmte technische Richtungen einschlage</li>
          <li><strong>Releases</strong> — was live gegangen ist, was sich geändert hat und was noch fehlt</li>
          <li><strong>Build in Public</strong> — inklusive Fehler, Umwege und Learnings</li>
        </ul>

        <h2>Die Produkte dahinter</h2>
        <p><strong>ZenPost Studio</strong> ist meine lokale KI-Content-App. <strong>ZenOrbit</strong> ist mein Builder für radiale Menüs. Daneben entstehen weitere Tools, Libraries und interne Workflows, die hier ebenfalls auftauchen werden.</p>

        <h2>Warum dieses Format</h2>
        <p>Ich will alle Entwicklung als nachvollziehbares Tagebuch festhalten: Tag für Tag, mit Fokus, Status, Blockern und den nächsten Schritten. So bleibt der Prozess sichtbar — für mich und für alle, die Produktentwicklung nicht nur im fertigen Zustand sehen wollen.</p>

        <h2>Design Guide</h2>
        <p>Hinter ZenDev steht eine klare Designlinie: <strong>Code + Design als Einheit</strong>. Das Kanji <strong>禅</strong> im Logo ist kein Zufall — es steht für Konzentration, Klarheit und Fokus. Den vollständigen Hintergrund zur Designsprache, Farbwelt, Typografie und Motion findest du im <a href="/post/design-guide-denis-bitter" onclick="navigate('/post/design-guide-denis-bitter'); return false;">Design Guide →</a></p>

        <h2>Sag Hallo</h2>
        <p>Feedback, Fragen, Ideen → <a href="https://denisbitter.de/contact" target="_blank" rel="noopener">Schreib mir</a> oder schau auf 
          <a href="https://github.com/THEORIGINALBITTER" target="_blank" rel="noopener">GitHub</a>,
           <a href="https://www.linkedin.com/in/denisbitter/" target="_blank" rel="noopener">LinkedIN</a>,
          </p>
      </div>
      <div class="post-signature">
        <img src="https://denisbitter.de/images/uschrift" alt="Denis Bitter" class="signature-img" />
      </div>
    </article>

        var isLight = document.documentElement.getAttribute('data-theme') === 'light';
        moon.style.display = isLight ? 'block' : 'none';
        sun.style.display  = isLight ? 'none'  : 'block';
        btn.title = isLight ? 'Dark Mode' : 'Light Mode';
      }
      updateIcon();
      btn.addEventListener('click', function() {
        var isLight = document.documentElement.getAttribute('data-theme') === 'light';
        if (isLight) {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('zp-theme', 'dark');
        } else {
          document.documentElement.setAttribute('data-theme', 'light');
          localStorage.setItem('zp-theme', 'light');
        }
        updateIcon();
      });
    })();
  </script>
